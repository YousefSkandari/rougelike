name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: target/release/rogue-ai
          - name: Windows
            os: windows-latest
            artifact: target/release/rogue-ai.exe
          - name: macOS
            os: macos-latest
            artifact: target/release/rogue-ai
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rogue-ai-${{ matrix.name }}
          path: ${{ matrix.artifact }}
